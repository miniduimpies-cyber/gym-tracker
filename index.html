<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0e"><link rel="manifest" href="manifest.webmanifest"><title>Gym Tracker</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><h1>💪 Gym Tracker</h1><small id="status">Saved locally · ready offline</small></div><b class="streak">🔥 <span id="streak">0</span> day streak</b></header><section id="today" class="tab active"><div class="hero"><h2 id="title"></h2><p id="date"></p><div class="progress"><i id="bar"></i></div><small id="progress"></small></div><div id="exercises"></div><button class="primary wide" id="finish">Finish workout</button></section><section id="plan" class="tab"><h2>Workout plan</h2><p>Choose a routine for today.</p><div id="plans"></div></section><section id="records" class="tab"><h2>Personal records</h2><div id="prs"></div></section><section id="calendar" class="tab"><div class="month"><button id="prev">‹</button><h2 id="month"></h2><button id="next">›</button></div><div class="week">Sun Mon Tue Wed Thu Fri Sat</div><div id="days"></div><article id="detail">Select a completed day to view it.</article></section><section id="stats" class="tab"><h2>Progress</h2><div class="stats"><article><b id="workouts">0</b><small>Workouts</small></article><article><b id="best">0</b><small>Best streak</small></article><article><b id="volume">0</b><small>Volume (kg)</small></article><article><b id="prcount">0</b><small>PR exercises</small></article></div><article class="chart"><label>Weight progression <select id="chartSelect"></select></label><canvas id="chart" height="220"></canvas></article></section><nav><button data-tab="today" class="selected">☀️<small>Today</small></button><button data-tab="plan">📋<small>Plan</small></button><button data-tab="records">🏆<small>Records</small></button><button data-tab="calendar">📅<small>Calendar</small></button><button data-tab="stats">📈<sma
