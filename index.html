<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💪 Gym Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            padding: 16px 16px 12px;
            border-bottom: 2px solid #e63946;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }

        .streak {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(230, 57, 70, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #e63946;
            font-weight: 600;
            font-size: 14px;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 80px;
        }

        .content::-webkit-scrollbar {
            width: 6px;
        }

        .content::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .content::-webkit-scrollbar-thumb {
            background: #e63946;
            border-radius: 3px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* TODAY TAB */

        .today-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .day-name {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ff6b6b 0%, #e63946 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .day-date {
            font-size: 14px;
            color: #888;
        }

        .exercise-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .exercise-card.completed {
            border-color: #e63946;
            background: rgba(230, 57, 70, 0.08);
        }

        .exercise-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #e63946;
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
        }

        .checkbox.checked {
            background: #e63946;
            color: #000;
            font-weight: bold;
        }

        .exercise-info {
            flex: 1;
        }

        .exercise-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .exercise-details {
            font-size: 12px;
            color: #aaa;
            line-height: 1.4;
        }

        .exercise-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn-small {
            flex: 1;
            min-width: 100px;
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-small:hover {
            background: #333;
            border-color: #e63946;
        }

        .btn-timer {
            background: linear-gradient(135deg, #e63946 0%, #ff6b6b 100%);
            border: none;
            color: #fff;
            font-weight: 600;
        }

        .btn-form {
            background: rgba(100, 150, 255, 0.2);
            border: 1px solid #6496ff;
            color: #6496ff;
        }

        .weight-input {
            width: 100%;
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .notes-input {
            width: 100%;
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            margin-bottom: 8px;
            resize: none;
            font-family: inherit;
        }

        .complete-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e63946 0%, #ff6b6b 100%);
            border: none;
            color: #000;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.2s;
        }

        .complete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(230, 57, 70, 0.4);
        }

        /* TIMER MODAL */

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            border: 2px solid #e63946;
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            max-width: 300px;
            width: 90%;
        }

        .timer-display {
            font-size: 72px;
            font-weight: 700;
            color: #e63946;
            font-variant-numeric: tabular-nums;
            margin: 24px 0;
            font-family: 'Courier New', monospace;
        }

        .timer-label {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 24px;
        }

        .timer-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-primary {
            flex: 1;
            padding: 12px 24px;
            background: linear-gradient(135deg, #e63946 0%, #ff6b6b 100%);
            border: none;
            color: #000;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.4);
        }

        .btn-secondary {
            flex: 1;
            padding: 12px 24px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #333;
        }

        /* PLAN TAB */

        .day-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .day-section:hover {
            border-color: #e63946;
        }

        .day-section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #e63946;
        }

        .day-section-exercises {
            font-size: 12px;
            color: #aaa;
            line-height: 1.6;
        }

        /* PRS TAB */

        .pr-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pr-left {
            flex: 1;
        }

        .pr-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .pr-date {
            font-size: 12px;
            color: #888;
        }

        .pr-weight {
            font-size: 24px;
            font-weight: 700;
            color: #e63946;
            text-align: right;
        }

        /* HISTORY TAB */

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }

        .calendar-day {
            aspect-ratio: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .calendar-day:hover {
            border-color: #e63946;
        }

        .calendar-day.completed {
            background: linear-gradient(135deg, #e63946 0%, #ff6b6b 100%);
            color: #000;
            border-color: #e63946;
            font-weight: 600;
        }

        .calendar-day-num {
            font-weight: 600;
        }

        .calendar-day-type {
            font-size: 10px;
            margin-top: 2px;
            opacity: 0.7;
        }

        /* STATS TAB */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #e63946;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: #aaa;
        }

        /* NAVIGATION */

        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-top: 2px solid #e63946;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
        }

        .nav-btn {
            flex: 1;
            padding: 12px 8px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .nav-btn.active {
            color: #e63946;
        }

        .nav-btn:hover {
            color: #fff;
        }

        .nav-icon {
            font-size: 20px;
        }

        /* EMPTY STATE */

        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 14px;
            line-height: 1.6;
        }

        /* TOAST */

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #e63946 0%, #ff6b6b 100%);
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            animation: slideUp 0.3s ease-out;
            z-index: 999;
        }

        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            .header-title {
                font-size: 20px;
            }

            .day-name {
                font-size: 28px;
            }

            .timer-display {
                font-size: 56px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <div class="header">
            <div class="header-title">💪 GYM TRACKER</div>

            <div class="streak">
                <span>🔥</span>
                <span id="streakCount">0</span>
                <span>DAYS</span>
            </div>
        </div>

        <!-- CONTENT -->

        <div class="content">

            <!-- TODAY -->

            <div id="today" class="tab-content active">

                <div class="today-header">
                    <div class="day-name" id="todayName">Monday</div>
                    <div class="day-date" id="todayDate">Today</div>
                </div>

                <div id="todayExercises"></div>

                <button class="complete-btn" onclick="completeWorkout()">
                    🔥 COMPLETE WORKOUT!
                </button>

            </div>

            <!-- PLAN -->

            <div id="plan" class="tab-content">
                <div id="planContent"></div>
            </div>

            <!-- PRS -->

            <div id="prs" class="tab-content">
                <div id="prsContent"></div>
            </div>

            <!-- HISTORY -->

            <div id="history" class="tab-content">
                <div id="historyContent"></div>
            </div>

            <!-- STATS -->

            <div id="stats" class="tab-content">
                <div id="statsContent"></div>
            </div>

        </div>

        <!-- NAVIGATION -->

        <div class="nav">

            <button class="nav-btn active" onclick="switchTab('today', this)">
                <div class="nav-icon">💪</div>
                <div>Today</div>
            </button>

            <button class="nav-btn" onclick="switchTab('plan', this)">
                <div class="nav-icon">📋</div>
                <div>Plan</div>
            </button>

            <button class="nav-btn" onclick="switchTab('prs', this)">
                <div class="nav-icon">🏆</div>
                <div>PRs</div>
            </button>

            <button class="nav-btn" onclick="switchTab('history', this)">
                <div class="nav-icon">📅</div>
                <div>History</div>
            </button>

            <button class="nav-btn" onclick="switchTab('stats', this)">
                <div class="nav-icon">📊</div>
                <div>Stats</div>
            </button>

        </div>

    </div>

    <!-- TIMER MODAL -->

    <div id="timerModal" class="modal">

        <div class="modal-content">

            <div class="timer-label" id="timerLabel">
                Rest Timer
            </div>

            <div class="timer-display" id="timerDisplay">
                00:00
            </div>

            <div class="timer-buttons">

                <button
                    class="btn-primary"
                    id="timerToggle"
                    onclick="toggleTimer()">
                    START
                </button>

                <button
                    class="btn-secondary"
                    onclick="closeTimer()">
                    CLOSE
                </button>

            </div>

        </div>

    </div>

    <script>

        /* =========================
           WORKOUT DATA
        ========================= */

        const workouts = {

                type: 'Chest + Triceps',

                exercises: [

                        name: 'Barbell Bench Press',

                    },

                    {
                        name: 'Incline Dumbbell Press',
                        sets: 3,
                        reps: '8–10',
                        rest: '90 sec',
                        youtube: 'Incline dumbbell press form'
                    },

                    {
                        name: 'Chest Fly',
                        sets: 3,
                        reps: '12–15',
                        rest: '60 sec',
                        youtube: 'Chest fly form'
                    },

                    {

                ]
            },

            tuesday: {

                    {

                    {

                    },

                    {
                        name: 'Hammer Curl',

                        reps: '12',

                ]
            },

            wednesday: {
                day: 'Wednesday',
                type: 'Legs',

                exercises: [
                    {
                        name: 'Squat',

                    },

                    {
                        name: 'Romanian Deadlift',
                        sets: 3,

                    },

                    {

                        sets: 3,
                        reps: '10',

                    },

                    {

                        reps: '12',

                    },

                    {

                        sets: 4,
                        reps: '15',

                    }
                ]
            },

            thursday: {
                day: 'Thursday',
                type: 'Shoulders + Abs',

                exercises: [
                    {
                        name: 'Overhead Press',
                        sets: 4,
                        reps: '6–8',
                        rest: '2–3 min',
                        youtube: 'Overhead press form'
                    },

                    {
                        name: 'Lateral Raise',
                        sets: 4,
                        reps: '12–15',
                        rest: '60 sec',
                        youtube: 'Lateral raise form'
                    },

                    {
                        name: 'Rear Delt Fly',

                        reps: '15',
                        rest: '60 sec',
                        youtube: 'Rear delt fly form'
                    },

                    {
                        name: 'Shrugs',
                        sets: 3,
                        reps: '12',
                        rest: '60 sec',
                        youtube: 'Shrugs form'
                    },

                    {
                        name: 'Hanging Leg Raise',
                        sets: 3,
                        reps: '12',
                        rest: '60 sec',
                        youtube: 'Hanging leg raise form'
                    },

                    {
                        name: 'Plank',
                        sets: 3,
                        reps: '45–60 sec',
                        rest: '60 sec',
                        youtube: 'Plank form'
                    }
                ]
            },

            friday: {
                day: 'Friday',
                type: 'Upper Body',

                exercises: [
                    {
                        name: 'Incline Bench',
                        sets: 3,
                        reps: '8',
                        rest: '90 sec',
                        youtube: 'Incline bench press form'
                    },

                    {
                        name: 'Pull-ups or Pulldown',
                        sets: 3,
                        reps: '8–10',
                        rest: '90 sec',
                        youtube: 'Pull ups form'
                    },

                    {
                        name: 'Dumbbell Shoulder Press',
                        sets: 3,
                        reps: '10',
                        rest: '90 sec',
                        youtube: 'Dumbbell shoulder press form'
                    },

                    {
                        name: 'Cable Row',
                        sets: 3,
                        reps: '10',
                        rest: '90 sec',
                        youtube: 'Cable row form'
                    },

                    {
                        name: 'Lateral Raise',
                        sets: 2,
                        reps: '15',
                        rest: '60 sec',
                        youtube: 'Lateral raise form'
                    },

                    {
                        name: 'Bicep Curl + Tricep Pushdown',
                        sets: 2,
                        reps: '12 each',
                        rest: '60 sec',
                        youtube: 'Bicep curl and tricep pushdown'
                    }
                ]
            }
        };


        /* =========================
           STATE
        ========================= */

        let currentTab = 'today';

        let timerInterval = null;

        let timerSeconds = 0;

        let timerRunning = false;


        /* =========================
           INITIALIZE
        ========================= */

        function init() {

            renderToday();

            renderPlan();

            renderPRs();

            renderHistory();

            renderStats();

            updateStreak();

        }


        /* =========================
           TODAY'S WORKOUT
        ========================= */

        function getTodayWorkout() {

            const days = [
                'sunday',
                'monday',
                'tuesday',
                'wednesday',
                'thursday',
                'friday',
                'saturday'
            ];

            const today = new Date().getDay();

            const dayKey = days[today];

            return workouts[dayKey] || workouts.monday;

        }


        /* =========================
           RENDER TODAY
        ========================= */

        function renderToday() {

            const workout = getTodayWorkout();

            const todayName =
                document.getElementById('todayName');

            const todayDate =
                document.getElementById('todayDate');

            const container =
                document.getElementById('todayExercises');


            todayName.textContent = workout.day;


            const dateStr =
                new Date().toLocaleDateString(
                    'en-US',
                    {
                        month: 'short',
                        day: 'numeric'
                    }
                );


            todayDate.textContent = dateStr;


            container.innerHTML = '';


            const savedData =
                getWorkoutData(workout.day);


            workout.exercises.forEach((exercise, idx) => {

                const completed =
                    savedData.completed[idx] || false;

                const weight =
                    savedData.weights[idx] || '';

                const notes =
                    savedData.notes[idx] || '';


                const card =
                    document.createElement('div');


                card.className =
                    `exercise-card ${completed ? 'completed' : ''}`;


                card.innerHTML = `

                    <div class="exercise-header">

                        <div
                            class="checkbox ${completed ? 'checked' : ''}"
                            onclick="toggleExercise('${workout.day}', ${idx})"
                        >
                            ${completed ? '✓' : ''}
                        </div>

                        <div class="exercise-info">

                            <div class="exercise-name">
                                ${exercise.name}
                            </div>

                            <div class="exercise-details">
                                ${exercise.sets}×${exercise.reps}
                                • Rest: ${exercise.rest}
                            </div>

                        </div>

                    </div>


                    <div class="exercise-actions">

                        <input
                            type="text"
                            class="weight-input"
                            placeholder="Weight/Reps"
                            value="${weight}"
                            onchange="saveWeight('${workout.day}', ${idx}, this.value)"
                        >

                        <button
                            class="btn-small btn-timer"
                            onclick="startTimer('${exercise.rest}')"
                        >
                            ⏱ Rest
                        </button>

                        <button
                            class="btn-small btn-form"
                            onclick="openForm('${exercise.youtube}')"
                        >
                            ▶ Form
                        </button>

                    </div>


                    <textarea
                        class="notes-input"
                        placeholder="Add notes..."
                        onchange="saveNotes('${workout.day}', ${idx}, this.value)"
                    >${notes}</textarea>

                `;


                container.appendChild(card);

            });

        }


        /* =========================
           PLAN
        ========================= */

        function renderPlan() {

            const container =
                document.getElementById('planContent');

            container.innerHTML = '';


            Object.values(workouts).forEach(workout => {

                const section =
                    document.createElement('div');

                section.className = 'day-section';


                section.innerHTML = `

                    <div class="day-section-title">
                        ${workout.day} — ${workout.type}
                    </div>

                    <div class="day-section-exercises">

                        ${workout.exercises
                            .map(e =>
                                `${e.name}: ${e.sets}×${e.reps}`
                            )
                            .join('<br>')
                        }

                    </div>

                `;


                container.appendChild(section);

            });

        }


        /* =========================
           PRs
        ========================= */

        function renderPRs() {

            const container =
                document.getElementById('prsContent');

            const allPRs = getPRs();


            if (Object.keys(allPRs).length === 0) {

                container.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-state-icon">
                            🏆
                        </div>

                        <div class="empty-state-text">
                            No PRs yet. Complete workouts
                            and log your weights!
                        </div>

                    </div>

                `;

                return;
            }


            container.innerHTML = '';


            Object.entries(allPRs).forEach(
                ([exercise, data]) => {

                    const card =
                        document.createElement('div');

                    card.className = 'pr-card';


                    const date =
                        new Date(data.date)
                            .toLocaleDateString(
                                'en-US',
                                {
                                    month: 'short',
                                    day: 'numeric'
                                }
                            );


                    card.innerHTML = `

                        <div class="pr-left">

                            <div class="pr-name">
                                ${exercise}
                            </div>

                            <div class="pr-date">
                                ${date}
                            </div>

                        </div>

                        <div class="pr-weight">
                            ${data.weight}
                        </div>

                    `;


                    container.appendChild(card);

                }
            );

        }


        /* =========================
           HISTORY
        ========================= */

        function renderHistory() {

            const container =
                document.getElementById('historyContent');

            const history = getHistory();


            container.innerHTML = '';


            const calendar =
                document.createElement('div');

            calendar.className = 'calendar';


            const today = new Date();

            const year = today.getFullYear();

            const month = today.getMonth();


            const firstDay =
                new Date(year, month, 1).getDay();


            const daysInMonth =
                new Date(year, month + 1, 0).getDate();


            for (let i = 0; i < firstDay; i++) {

                const empty =
                    document.createElement('div');

                empty.style.background = 'transparent';

                empty.style.border = 'none';

                calendar.appendChild(empty);

            }


            for (let day = 1; day <= daysInMonth; day++) {

                const dateStr =
                    `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;


                const completed =
                    history[dateStr] ? true : false;


                const dayEl =
                    document.createElement('div');

                dayEl.className =
                    `calendar-day ${completed ? 'completed' : ''}`;


                dayEl.innerHTML = `

                    <div class="calendar-day-num">
                        ${day}
                    </div>

                    ${
                        completed
                            ? '<div class="calendar-day-type">✓</div>'
                            : ''
                    }

                `;


                calendar.appendChild(dayEl);

            }


            container.appendChild(calendar);


            const summary =
                document.createElement('div');


            summary.style.textAlign = 'center';

            summary.style.color = '#aaa';

            summary.style.fontSize = '14px';


            summary.innerHTML = `

                <p>
                    Workouts this month:
                    <strong style="color:#e63946;">
                        ${Object.keys(history).length}
                    </strong>
                </p>

            `;


            container.appendChild(summary);

        }


        /* =========================
           STATS
        ========================= */

        function renderStats() {

            const container =
                document.getElementById('statsContent');

            const history = getHistory();

            const allPRs = getPRs();

            const streak = getStreak();


            const totalWorkouts =
                Object.keys(history).length;


            const consistency =
                Math.min(
                    100,
                    Math.round(
                        totalWorkouts / 30 * 100
                    )
                );


            container.innerHTML = `

                <div class="stats-grid">

                    <div class="stat-card">

                        <div class="stat-value">
                            ${streak}
                        </div>

                        <div class="stat-label">
                            Current Streak
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-value">
                            ${totalWorkouts}
                        </div>

                        <div class="stat-label">
                            Total Workouts
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-value">
                            ${Object.keys(allPRs).length}
                        </div>

                        <div class="stat-label">
                            Personal Records
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-value">
                            ${consistency}%
                        </div>

                        <div class="stat-label">
                            Consistency
                        </div>

                    </div>

                </div>

            `;

        }


        /* =========================
           STORAGE
        ========================= */

        function getWorkoutData(day) {

            const key =
                `workout_${day}`;

            const data =
                localStorage.getItem(key);


            if (!data) {

                return {
                    completed: {},
                    weights: {},
                    notes: {}
                };

            }


            try {

                return JSON.parse(data);

            } catch {

                return {
                    completed: {},
                    weights: {},
                    notes: {}
                };

            }

        }


        function saveWorkoutData(day, data) {

            localStorage.setItem(
                `workout_${day}`,
                JSON.stringify(data)
            );

        }


        /* =========================
           EXERCISE CHECKBOX
        ========================= */

        function toggleExercise(day, idx) {

            const data =
                getWorkoutData(day);


            data.completed[idx] =
                !data.completed[idx];


            saveWorkoutData(
                day,
                data
            );


            renderToday();

        }


        /* =========================
           WEIGHT
        ========================= */

        function saveWeight(day, idx, value) {

            const data =
                getWorkoutData(day);


            data.weights[idx] = value;


            saveWorkoutData(
                day,
                data
            );


            savePR(
                day,
                idx,
                value
            );

        }


        /* =========================
           NOTES
        ========================= */

        function saveNotes(day, idx, value) {

            const data =
                getWorkoutData(day);


            data.notes[idx] = value;


            saveWorkoutData(
                day,
                data
            );

        }


        /* =========================
           PR SYSTEM
        ========================= */

        function savePR(day, idx, weight) {

            if (!weight) return;


            const workout =
                workouts[day.toLowerCase()];


            if (!workout) return;


            const exercise =
                workout.exercises[idx];


            const key =
                exercise.name;


            const prs =
                JSON.parse(
                    localStorage.getItem('prs') || '{}'
                );


            const numericWeight =
                parseFloat(weight);


            if (
                !isNaN(numericWeight) &&
                (
                    !prs[key] ||
                    numericWeight >
                    parseFloat(prs[key].weight)
                )
            ) {

                prs[key] = {
                    weight: weight,
                    date: new Date().toISOString()
                };


                localStorage.setItem(
                    'prs',
                    JSON.stringify(prs)
                );


                renderPRs();

                showToast('🏆 New PR!');

            }

        }


        function getPRs() {

            try {

                return JSON.parse(
                    localStorage.getItem('prs') || '{}'
                );

            } catch {

                return {};

            }

        }


        function getHistory() {

            try {

                return JSON.parse(
                    localStorage.getItem('history') || '{}'
                );

            } catch {

                return {};

            }

        }


        /* =========================
           COMPLETE WORKOUT
        ========================= */

        function completeWorkout() {

            const today =
                new Date();


            const dateStr =
                today.toISOString().split('T')[0];


            const history =
                getHistory();


            history[dateStr] = {

                day: today.toLocaleDateString(),

                completed: true

            };


            localStorage.setItem(
                'history',
                JSON.stringify(history)
            );


            renderHistory();

            renderStats();

            updateStreak();


            showToast(
                '🔥 Workout completed! Great work!'
            );

        }


        /* =========================
           STREAK
        ========================= */

        function getStreak() {

            const history =
                getHistory();


            let streak = 0;

            let checkDate =
                new Date();


            while (true) {

                const dateStr =
                    checkDate.toISOString()
                        .split('T')[0];


                if (history[dateStr]) {

                    streak++;

                    checkDate.setDate(
                        checkDate.getDate() - 1
                    );

                } else {

                    break;

                }

            }


            return streak;

        }


        function updateStreak() {

            document.getElementById(
                'streakCount'
            ).textContent =
                getStreak();

        }


        /* =========================
           TIMER
        ========================= */

        function startTimer(restStr) {

            let seconds = 60;


            const minMatch =
                restStr.match(/(\d+)(?:–(\d+))?\s*min/);

            const secMatch =
                restStr.match(/(\d+)(?:–(\d+))?\s*sec/);


            if (minMatch) {

                const min1 =
                    parseInt(minMatch[1]);

                const min2 =
                    minMatch[2]
                        ? parseInt(minMatch[2])
                        : min1;


                const average =
                    (min1 + min2) / 2;


                seconds =
                    Math.round(average * 60);

            } else if (secMatch) {

                const sec1 =
                    parseInt(secMatch[1]);

                const sec2 =
                    secMatch[2]
                        ? parseInt(secMatch[2])
                        : sec1;


                seconds =
                    Math.round(
                        (sec1 + sec2) / 2
                    );

            }


            timerSeconds =
                seconds;


            document.getElementById(
                'timerLabel'
            ).textContent =
                `Rest ${restStr}`;


            document.getElementById(
                'timerModal'
            ).classList.add('active');


            document.getElementById(
                'timerToggle'
            ).textContent =
                'START';


            timerRunning = false;


            updateTimerDisplay();

        }


        function toggleTimer() {

            if (timerSeconds <= 0) {

                return;

            }


            timerRunning =
                !timerRunning;


            document.getElementById(
                'timerToggle'
            ).textContent =
                timerRunning
                    ? 'PAUSE'
                    : 'RESUME';


            if (timerRunning) {

                timerInterval =
                    setInterval(() => {

                        timerSeconds--;

                        updateTimerDisplay();


                        if (timerSeconds <= 0) {

                            clearInterval(
                                timerInterval
                            );


                            timerRunning =
                                false;


                            document.getElementById(
                                'timerToggle'
                            ).textContent =
                                'DONE';


                            playNotification();

                            showToast(
                                '⏱️ Rest finished! Go again!'
                            );

                        }

                    }, 1000);

            } else {

                clearInterval(
                    timerInterval
                );

            }

        }


        function updateTimerDisplay() {

            const mins =
                Math.floor(
                    timerSeconds / 60
                );


            const secs =
                timerSeconds % 60;


            document.getElementById(
                'timerDisplay'
            ).textContent =

                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        }


        function closeTimer() {

            clearInterval(
                timerInterval
            );


            timerRunning =
                false;


            document.getElementById(
                'timerModal'
            ).classList.remove(
                'active'
            );

        }


        /* =========================
           TIMER SOUND
        ========================= */

        function playNotification() {

            try {

                const audioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();


                const oscillator =
                    audioContext.createOscillator();


                const gain =
                    audioContext.createGain();


                oscillator.connect(gain);

                gain.connect(
                    audioContext.destination
                );


                oscillator.frequency.value =
                    800;


                oscillator.type =
                    'sine';


                gain.gain.setValueAtTime(
                    0.3,
                    audioContext.currentTime
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.01,
                    audioContext.currentTime + 0.5
                );


                oscillator.start(
                    audioContext.currentTime
                );


                oscillator.stop(
                    audioContext.currentTime + 0.5
                );

            } catch (error) {

                console.log(
                    'Notification sound unavailable'
                );

            }

        }


        /* =========================
           TAB SWITCHING
        ========================= */

        function switchTab(tab, button) {

            currentTab =
                tab;


            document
                .querySelectorAll('.tab-content')
                .forEach(el =>
                    el.classList.remove('active')
                );


            document
                .getElementById(tab)
                .classList.add('active');


            document
                .querySelectorAll('.nav-btn')
                .forEach(el =>
                    el.classList.remove('active')
                );


            button.classList.add('active');


            if (tab === 'prs') {

                renderPRs();

            }


            if (tab === 'history') {

                renderHistory();

            }


            if (tab === 'stats') {

                renderStats();

            }

        }


        /* =========================
           YOUTUBE FORM
        ========================= */

        function openForm(exercise) {

            const query =
                encodeURIComponent(
                    exercise
                );


            window.open(
                `https://www.youtube.com/results?search_query=${query}`,
                '_blank'
            );

        }


        /* =========================
           TOAST
        ========================= */

        function showToast(message) {

            const toast =
                document.createElement('div');


            toast.className =
                'toast';


            toast.textContent =
                message;


            document.body.appendChild(
                toast
            );


            setTimeout(
                () => toast.remove(),
                2000
            );

        }


        /* =========================
           START APP
        ========================= */

        init();

    </script>
